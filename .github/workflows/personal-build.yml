name: Personal APK build

# Builds an installable debug APK of this fork and publishes it on the "personal-latest" pre-release, so it can be
# downloaded straight from the phone. The debug keystore is fixed (ci/debug.keystore) so new builds install as
# updates over the previous one, keeping the scenarios.

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: zulu
        java-version: '25'
        cache: gradle

    - name: Use the fixed debug keystore
      run: |
        mkdir -p ~/.android
        cp ci/debug.keystore ~/.android/debug.keystore

    - name: Build debug APK
      run: ./gradlew --no-daemon --max-workers=4 :smartautoclicker:assembleFDroidDebug
      env:
        JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true

    - name: Run unit tests of the touched modules
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        ./gradlew --no-daemon --max-workers=4 --continue \
          :core:smart:database:testFDroidDebugUnitTest \
          :core:smart:processing:testFDroidDebugUnitTest \
          :feature:backup:testFDroidDebugUnitTest

    - name: Collect outputs
      run: |
        mkdir -p out
        find smartautoclicker/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
        ls -la out

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: apk-and-schemas
        retention-days: 14
        path: |
          out/*.apk
          core/smart/database/schemas/**/*.json

    - name: Publish to the personal-latest pre-release
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view personal-latest >/dev/null 2>&1 || \
          gh release create personal-latest --prerelease --title "Personal latest build" \
            --notes "Latest debug build of this fork. Install the universal or arm64-v8a APK."
        gh release upload personal-latest out/*.apk --clobber
        gh release edit personal-latest --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')."
